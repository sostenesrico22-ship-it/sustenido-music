<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustenido Music Professor</title>
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SM Professor">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.prof{border-collapse:collapse;width:100%;font-size:.9em;background:#fff}
.prof th,.prof td{border:1px solid #e1e4ee;padding:6px;text-align:center;vertical-align:middle}
.prof th{background:#1F2A44;color:#fff;position:sticky;top:0}
.prof td.nome{text-align:left;font-weight:700;white-space:nowrap}
.ok{background:#C8E6C9;color:#1B5E20;font-weight:800}.no{background:#FFCDD2;color:#B71C1C;font-weight:800}.vz{color:#aaa}
.aberta{min-width:180px;text-align:left!important;font-size:.9em}
.mini{font:inherit;font-size:.85em;padding:5px 8px;border-radius:8px;border:2px solid #1F2A44;background:#fff;cursor:pointer;margin:2px}
.mini.on{background:#1F2A44;color:#fff}.mini.lib{border-color:#2E7D32;color:#2E7D32}.mini.lib.on{background:#2E7D32;color:#fff}
.warn{color:#C62828;font-weight:800}.st{font-size:.8em;padding:2px 6px;border-radius:6px;background:#FFF3C4}.st.env{background:#C8E6C9}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><span class="brand"><img src="../assets/img/logo.svg" alt=""><span class="brand-text"><span class="brand-name">Sustenido <span>Music</span></span><span class="brand-sub">Elevando seu conhecimento</span></span></span><span class="header-link">App do Professor</span><button class="mini" id="sair" hidden>Sair</button></div></header>
<main class="wrap">
  <section class="card" id="login">
    <h2>Entrar</h2>
    <p>Acesso só do professor. Entre com a conta Google <b>sostenesrico22@gmail.com</b>.</p>
    <div class="concluir"><button class="btn-concluir feita" id="entrar">Entrar com Google</button></div>
    <p class="warn" id="erro" hidden></p>
  </section>
  <section class="card" id="painel" hidden>
    <h2 id="titulo">Aula 1 + Aula 2 — Teste · ao vivo</h2>
    <div class="bar">
      <label>Prova / teste: <select id="provaSel"><optgroup label="Teclado · Nível Básico"><option value="aulas-1-2" selected>Aula 1 + Aula 2 — Teste (5 questões)</option><option value="basico-1">Prova do Básico (aulas 1–5)</option></optgroup></select></label>
      <span id="resumo"></span>
      <button class="mini" id="arquivar">🗂 Arquivar rodada</button>
    </div>
    <p style="font-size:.85em">Gabarito: <span id="gab"></span> · <span id="abertaNome">Q escrita</span> (você corrige com ✓/✗): <i id="esperado"></i></p>
    <div class="tbl-wrap"><table class="prof"><thead id="thead"></thead><tbody id="tbody"><tr><td>Carregando…</td></tr></tbody></table></div>
  </section>
</main>
<script type="module" src="professor.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
